name: Build G2NRinventory
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  inventory-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/inventory_layout.cpp -o inventory-layout
          ./inventory-layout
  windows:
    needs: inventory-tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build the Union plugin
        shell: powershell
        run: ./Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: G2NRinventory
          path: release/G2NRinventory.vdf
          if-no-files-found: error
